<!doctype html>
<html lang="en" data-theme="stone">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cairn — one step at a time</title>
    <meta name="description" content="A calm, private to-do app: type what's on your mind, Cairn sorts it and shows you one next step. Free, no sign-up." />
    <meta name="theme-color" content="#eef0ec" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Cairn — one step at a time" />
    <meta property="og:description" content="Type what's on your mind. Cairn sorts it and shows you one next step." />
    <meta property="og:type" content="website" />
    <script>
      // Set the theme and text size before first paint (useTheme keeps cairn-appearance current).
      try {
        const root = document.documentElement
        const saved = JSON.parse(localStorage.getItem('cairn-appearance') || '{}')
        const dark = matchMedia('(prefers-color-scheme: dark)').matches
        // Only known values reach the attributes (keep in sync with THEMES and TEXT_SIZES in src/model/themes.ts).
        const themes = ['stone', 'notes', 'moss', 'contrast', 'night', 'dusk', 'ink']
        root.dataset.theme = themes.includes(saved.theme) ? saved.theme : dark ? 'night' : 'stone'
        if (['default', 'large', 'larger'].includes(saved.textSize)) root.dataset.textSize = saved.textSize
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
